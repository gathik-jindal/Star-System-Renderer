<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Star System Renderer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
        integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
        crossorigin="anonymous" defer></script>
    <script src="index.js" type="module"></script>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #333;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        /* Use row-reverse to keep layout but match visual request */
        flex-direction: row;
        overflow: hidden;
        height: 100vh;
    }

    #container {
        width: 70%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        /* position: relative; <-- REMOVED FROM HERE */
    }

    #canvas-wrapper {
        position: relative;
        /* This is now the relative parent */
        width: 100%;
        /* It takes the size the canvas used to */
        height: 80%;
        max-width: 100%;
        display: block;
        /* Behave like a block */
        border-radius: 8px;
        /* Give the wrapper the border radius */
    }

    #star-system-canvas {
        border: 1px solid #555;
        background-color: #000;
        display: block;
        width: 100%;
        /* Fill the new wrapper */
        height: 100%;
        /* Fill the new wrapper */
        border-radius: 8px;
        /* Keep radius on canvas too */
    }

    #gizmo-canvas {
        width: 120px;
        height: 120px;
        position: absolute;
        /* Now positions relative to #canvas-wrapper */
        top: 10px;
        /* Small padding from the wrapper's top */
        right: 10px;
        /* Small padding from the wrapper's right */
        border-radius: 50%;
        z-index: 10;
        pointer-events: none;
    }


    #controls {
        margin-top: 20px;
    }

    #controls button {
        margin: 0 5px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #555;
        color: white;
        border: none;
        border-radius: 8px;
        transition: background-color 0.2s;
    }

    #controls button:hover {
        background-color: #777;
    }

    #controls button.active {
        background-color: #007aff;
        color: white;
    }

    /* Planet selection sidebar */
    #planet-selections {
        width: 30%;
        height: calc(100vh - 20px);
        overflow-y: auto;
        background-color: #222;
        margin: 10px;
        border-radius: 8px;
        padding: 10px;

        /* Grid layout for the planet cards */
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        align-content: start;
    }

    /* Individual planet card */
    .planet-card {
        background-color: #333;
        border-radius: 8px;
        border: 1px solid #444;
        overflow: hidden;
        text-align: center;
        padding: 10px;
        transition: transform 0.2s, box-shadow 0.2s;
        cursor: pointer;
        /* Added cursor */
    }

    .planet-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .planet-card h3 {
        font-size: 1rem;
        margin-bottom: 10px;
        font-weight: 500;
    }

    /* Container for the 3D canvas inside the card */
    .planet-preview {
        width: 100%;
        /* Make it square */
        padding-bottom: 100%;
        position: relative;
        background-color: #000;
        border-radius: 4px;
        /* Gizmo shouldn't capture clicks */
        pointer-events: none;
    }

    .planet-preview canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    #help-text {
        background-color: #222;
        border: 1px solid #444;
        padding: 10px 15px;
        border-radius: 8px;
        margin-top: 15px;
        font-size: 0.9em;
        width: 100%;
        height: auto;
        max-width: 500px;
    }

    #help-text ul {
        list-style: none;
        padding: 0;
        margin: 5px 0 0 0;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 20px;
    }

    #help-text li {
        margin: 0;
    }
</style>

<body>
    <div id="container">
        <div id="canvas-wrapper">
            <canvas id="star-system-canvas"></canvas>
            <canvas id="gizmo-canvas"></canvas>
        </div>

        <div id="help-text">
            <strong>Controls:</strong>
            <ul>
                <li><strong>Select Planet:</strong> Click in 'Top View' mode</li>
                <li><strong>Toggle Revolution:</strong> Spacebar</li>
                <li><strong>Toggle Manual Rotate:</strong> T</li>
                <li><strong>Manual Rotate:</strong> x/X, y/Y, z/Z (when ON)</li>
                <li><strong>Scale (Stationary):</strong> PageUp / PageDown</li>
                <li><strong>Rev. Speed:</strong> [ / ]</li>
                <li><strong>Delete:</strong> Delete/Backspace</li>
            </ul>
        </div>

        <div id="controls">
            <button id="3d-view">3D View</button>
            <button id="top-view">Top View</button>
        </div>
    </div>
    <div id="planet-selections"></div>
</body>

</html>
